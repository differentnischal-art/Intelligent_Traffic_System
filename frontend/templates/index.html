<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ITMS — Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #070a0f;
  --surface:  #0d1117;
  --border:   #1c2333;
  --accent:   #00e5ff;
  --accent2:  #39ff14;
  --warn:     #ff6b00;
  --red:      #ff2244;
  --text:     #c9d1d9;
  --muted:    #484f58;
  --font:     'Rajdhani', sans-serif;
  --mono:     'JetBrains Mono', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Grid background */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative; z-index: 1;
  max-width: 860px;
  margin: 0 auto;
  padding: 60px 24px 80px;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 56px;
  animation: fadeDown 0.6s ease both;
}

.header-tag {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--accent);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 12px;
  opacity: 0.8;
}

.header h1 {
  font-size: 3rem;
  font-weight: 700;
  letter-spacing: 2px;
  line-height: 1;
  color: #fff;
  text-transform: uppercase;
}

.header h1 span {
  color: var(--accent);
  position: relative;
}

.header h1 span::after {
  content: '';
  position: absolute;
  bottom: -4px; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}

.header p {
  margin-top: 16px;
  color: var(--muted);
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 1px;
}

/* Step card */
.step-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 32px;
  margin-bottom: 20px;
  animation: fadeUp 0.5s ease both;
  position: relative;
  overflow: hidden;
}

.step-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent);
}

.step-number {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--accent);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.step-card h2 {
  font-size: 1.4rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: 1px;
  margin-bottom: 20px;
}

/* Lane counter */
.lane-counter {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 24px;
}

.counter-btn {
  width: 44px; height: 44px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--accent);
  font-size: 1.4rem;
  font-family: var(--mono);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}

.counter-btn:hover {
  border-color: var(--accent);
  background: rgba(0,229,255,0.06);
  box-shadow: 0 0 12px rgba(0,229,255,0.15);
}

.counter-display {
  font-size: 3rem;
  font-weight: 700;
  font-family: var(--mono);
  color: var(--accent);
  min-width: 60px;
  text-align: center;
  text-shadow: 0 0 20px rgba(0,229,255,0.4);
}

.counter-label {
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 500;
  letter-spacing: 1px;
}

/* Lane pills */
.lane-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.lane-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg);
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--muted);
  transition: all 0.3s;
}

.lane-pill.active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(0,229,255,0.06);
}

.lane-pill .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
  transition: all 0.3s;
}

.lane-pill.active .dot {
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
}

/* Video upload grid */
#video-section { display: none; }

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
  margin-top: 8px;
}

.video-upload-card {
  border: 1px dashed var(--border);
  border-radius: 8px;
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  background: var(--bg);
}

.video-upload-card:hover {
  border-color: var(--accent);
  background: rgba(0,229,255,0.03);
}

.video-upload-card.loaded {
  border-style: solid;
  border-color: var(--accent2);
  background: rgba(57,255,20,0.04);
}

.upload-icon {
  font-size: 2rem;
  margin-bottom: 10px;
  display: block;
}

.lane-tag {
  font-family: var(--mono);
  font-size: 0.65rem;
  letter-spacing: 3px;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.upload-label {
  font-size: 0.85rem;
  color: var(--muted);
  font-weight: 500;
}

.file-name {
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--accent2);
  word-break: break-all;
  display: none;
}

.video-upload-card.loaded .file-name { display: block; }
.video-upload-card.loaded .upload-label { display: none; }
.video-upload-card.loaded .upload-icon { display: none; }

.check-icon {
  display: none;
  font-size: 2rem;
  margin-bottom: 10px;
}

.video-upload-card.loaded .check-icon { display: block; }

input[type="file"] { display: none; }

/* Launch button */
.launch-btn {
  width: 100%;
  padding: 18px;
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: var(--font);
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
  margin-top: 8px;
  display: none;
}

.launch-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s ease;
  z-index: 0;
}

.launch-btn:hover::before { transform: scaleX(1); }
.launch-btn:hover { color: var(--bg); }
.launch-btn span { position: relative; z-index: 1; }

.launch-btn.visible { display: block; }

/* Loading overlay */
#loading {
  display: none;
  position: fixed; inset: 0;
  background: rgba(7,10,15,0.95);
  z-index: 100;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
}

#loading.show { display: flex; }

.spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.loading-text {
  font-family: var(--mono);
  font-size: 0.85rem;
  color: var(--accent);
  letter-spacing: 2px;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeDown {
  from { opacity:0; transform: translateY(-20px); }
  to   { opacity:1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(20px); }
  to   { opacity:1; transform: translateY(0); }
}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">INITIALISING SYSTEM...</div>
</div>

<div class="container">

  <div class="header">
    <div class="header-tag">Intelligent Traffic Management</div>
    <h1>ITMS <span>Setup</span></h1>
    <p>Configure lanes and video sources before launching the dashboard</p>
  </div>

  <!-- Step 1: Choose lanes -->
  <div class="step-card" style="animation-delay:0.1s">
    <div class="step-number">Step 01</div>
    <h2>How many lanes to monitor?</h2>
    <div class="lane-counter">
      <button class="counter-btn" id="btn-minus">−</button>
      <div class="counter-display" id="lane-count-display">2</div>
      <button class="counter-btn" id="btn-plus">+</button>
      <div class="counter-label">Lane(s)<br/>selected</div>
    </div>
    <div class="lane-pills" id="lane-pills"></div>
  </div>

  <!-- Step 2: Upload videos -->
  <div class="step-card" id="video-section" style="animation-delay:0.2s">
    <div class="step-number">Step 02</div>
    <h2>Select video source for each lane</h2>
    <div class="video-grid" id="video-grid"></div>
  </div>

  <!-- Launch -->
  <button class="launch-btn" id="launch-btn" onclick="launch()">
    <span>⚡ Launch Traffic Dashboard</span>
  </button>

</div>

<script>
let laneCount  = 2;
let laneFiles  = {};
const MIN = 1, MAX = 8;

function updateLaneCount(val) {
  laneCount = Math.max(MIN, Math.min(MAX, val));
  document.getElementById('lane-count-display').textContent = laneCount;

  // Update pills
  const pills = document.getElementById('lane-pills');
  pills.innerHTML = '';
  for (let i = 1; i <= MAX; i++) {
    const pill = document.createElement('div');
    pill.className = 'lane-pill' + (i <= laneCount ? ' active' : '');
    pill.innerHTML = `<span class="dot"></span>LANE ${i}`;
    pills.appendChild(pill);
  }

  // Show video section
  document.getElementById('video-section').style.display = 'block';
  buildVideoGrid();
  checkLaunchReady();
}

function buildVideoGrid() {
  const grid = document.getElementById('video-grid');
  grid.innerHTML = '';
  for (let i = 1; i <= laneCount; i++) {
    const card = document.createElement('div');
    card.className = 'video-upload-card' + (laneFiles[i] ? ' loaded' : '');
    card.id = `upload-card-${i}`;
    card.innerHTML = `
      <span class="check-icon">✅</span>
      <span class="upload-icon">📹</span>
      <div class="lane-tag">Lane ${i}</div>
      <div class="upload-label">Click to select video</div>
      <div class="file-name" id="fname-${i}">${laneFiles[i] ? laneFiles[i].name : ''}</div>
      <input type="file" id="file-${i}" accept="video/*" onchange="fileSelected(${i}, this)"/>
    `;
    card.onclick = () => document.getElementById(`file-${i}`).click();
    grid.appendChild(card);
  }
}

function fileSelected(lane, input) {
  if (input.files.length > 0) {
    laneFiles[lane] = input.files[0];
    const card = document.getElementById(`upload-card-${lane}`);
    card.classList.add('loaded');
    document.getElementById(`fname-${lane}`).textContent = input.files[0].name;
  }
  checkLaunchReady();
}

function checkLaunchReady() {
  let allLoaded = true;
  for (let i = 1; i <= laneCount; i++) {
    if (!laneFiles[i]) { allLoaded = false; break; }
  }
  const btn = document.getElementById('launch-btn');
  btn.className = 'launch-btn' + (allLoaded ? ' visible' : '');
}

async function launch() {
  document.getElementById('loading').classList.add('show');

  try {
    const startData = new FormData();
    startData.append('lane_count', laneCount);

    const startRes = await fetch('/api/start', {
      method: 'POST',
      body: startData
    });

    if (!startRes.ok) {
      throw new Error('Could not initialise lanes');
    }

    for (let i = 1; i <= laneCount; i++) {
      const uploadData = new FormData();
      uploadData.append('file', laneFiles[i]);

      const uploadRes = await fetch(`/api/upload/lane_${i}`, {
        method: 'POST',
        body: uploadData
      });

      if (!uploadRes.ok) {
        throw new Error(`Could not upload video for lane ${i}`);
      }
    }

    window.location.href = '/dashboard';
  } catch(e) {
    alert(e.message || 'Cannot connect to server. Make sure the FastAPI server is running.');
    document.getElementById('loading').classList.remove('show');
  }
}

document.getElementById('btn-minus').onclick = () => updateLaneCount(laneCount - 1);
document.getElementById('btn-plus').onclick  = () => updateLaneCount(laneCount + 1);

// Init
updateLaneCount(2);
</script>
</body>
</html>
